// Imported bodies have no actual IVA. Crew and command now belong to the
// installed race seats; a car without an occupied command seat has no control.
// The original 944 already has a real IVA and is intentionally outside this selector.
@PART[kda-*-body]:HAS[@MODULE[KDAEngine]]:FINAL
{
 @CrewCapacity = 0
 !INTERNAL,* {}
 !MODULE[ModuleCommand],* {}
 MODULE
 {
  name = KDAImportedCrew
 }
}
