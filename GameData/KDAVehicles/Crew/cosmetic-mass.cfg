// KDA seats, seated crew and boarding locators do not change car mass/balance.
// EVA remains stock. The scoped KDACrew mass hooks also remove the automatic
// crew/inventory additions that KSP performs after PartModule mass modifiers.
@PART[kda-race-seat|kda-doorway-marker]:FINAL
{
 @mass = 0
 %applyKerbalMassModification = false
 %PhysicsSignificance = 1
}
